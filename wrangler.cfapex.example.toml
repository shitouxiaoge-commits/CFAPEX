# Copy to wrangler.cfapex.toml for a NEW Worker, then replace the Worker name and KV namespace ID.
# Wrangler creates and binds XHTTP_SESSION during deployment; Dashboard JS paste cannot do this.
name = "cfapex"
main = "dist/CFAPEX-worker.1.4.js"
compatibility_date = "2026-11-08"
keep_vars = true

[[kv_namespaces]]
binding = "K"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[durable_objects.bindings]]
name = "XHTTP_SESSION"
class_name = "CfapexXhttpSession"

[[migrations]]
tag = "cfapex-xhttp-v1"
new_sqlite_classes = ["CfapexXhttpSession"]
